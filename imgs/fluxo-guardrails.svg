<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 552" width="760" height="552" role="img" aria-label="Três camadas, dois pontos de bloqueio" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="guard-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a9a79a"/>
    </marker>
  </defs>
  <rect width="760" height="552" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#141413">Três camadas, dois pontos de bloqueio</text>

  <g fill="none" stroke="#a9a79a" stroke-width="1.25">
    <path d="M230 104V136" marker-end="url(#guard-arrow)"/>
    <path d="M230 192V224" marker-end="url(#guard-arrow)"/>
    <path d="M230 280V312" marker-end="url(#guard-arrow)"/>
    <path d="M230 368V400" marker-end="url(#guard-arrow)"/>
    <path d="M230 456V488" marker-end="url(#guard-arrow)"/>
    <path d="M390 164H510" marker-end="url(#guard-arrow)"/>
    <path d="M390 428H510" marker-end="url(#guard-arrow)"/>
  </g>

  <rect x="70" y="64" width="320" height="40" rx="8" fill="none" stroke="#a9a79a" stroke-width="1.25"/>
  <text x="230" y="88" text-anchor="middle" font-weight="600" fill="#141413">Mensagem do usuário</text>

  <rect x="70" y="136" width="320" height="56" rx="8" fill="none" stroke="#a9a79a" stroke-width="1.25"/>
  <text x="230" y="160" text-anchor="middle" font-weight="600" fill="#141413">Camada 1: guardrail de entrada</text>
  <text x="230" y="176" text-anchor="middle" font-size="11.5" fill="#5c5b55">Procura frases de ataque conhecidas</text>

  <rect x="70" y="224" width="320" height="56" rx="8" fill="none" stroke="#a9a79a" stroke-width="1.25"/>
  <text x="230" y="248" text-anchor="middle" font-weight="600" fill="#141413">Camada 2: prompt estruturado</text>
  <text x="230" y="264" text-anchor="middle" font-size="11.5" fill="#5c5b55">Separa as regras do texto do usuário</text>

  <rect x="70" y="312" width="320" height="56" rx="8" fill="none" stroke="#a9a79a" stroke-width="1.25"/>
  <text x="230" y="336" text-anchor="middle" font-weight="600" fill="#141413">Modelo de linguagem (falso na demo)</text>
  <text x="230" y="352" text-anchor="middle" font-size="11.5" fill="#5c5b55">Ingênuo: obedece a qualquer ordem</text>

  <rect x="70" y="400" width="320" height="56" rx="8" fill="none" stroke="#a9a79a" stroke-width="1.25"/>
  <text x="230" y="424" text-anchor="middle" font-weight="600" fill="#141413">Camada 3: guardrail de saída</text>
  <text x="230" y="440" text-anchor="middle" font-size="11.5" fill="#5c5b55">Confere se o segredo aparece na resposta</text>

  <rect x="70" y="488" width="320" height="40" rx="8" fill="none" stroke="#a9a79a" stroke-width="1.25"/>
  <text x="230" y="512" text-anchor="middle" font-weight="600" fill="#141413">Resposta ao usuário</text>

  <rect x="510" y="136" width="200" height="56" rx="8" fill="#2b6fd6" fill-opacity="0.12" stroke="#2b6fd6" stroke-width="2"/>
  <text x="610" y="160" text-anchor="middle" font-weight="600" fill="#141413">Entrada bloqueada</text>
  <text x="610" y="176" text-anchor="middle" font-size="11.5" fill="#5c5b55">O modelo nem é chamado</text>

  <rect x="510" y="400" width="200" height="56" rx="8" fill="#2b6fd6" fill-opacity="0.12" stroke="#2b6fd6" stroke-width="2"/>
  <text x="610" y="424" text-anchor="middle" font-weight="600" fill="#141413">Saída bloqueada</text>
  <text x="610" y="440" text-anchor="middle" font-size="11.5" fill="#5c5b55">O usuário não vê o segredo</text>

  <text x="450" y="156" text-anchor="middle" font-size="11.5" fill="#5c5b55">padrão suspeito</text>
  <text x="450" y="420" text-anchor="middle" font-size="11.5" fill="#5c5b55">segredo na saída</text>
  <text x="240" y="212" font-size="11.5" fill="#5c5b55">passa</text>
  <text x="240" y="476" font-size="11.5" fill="#5c5b55">passa</text>
</svg>
